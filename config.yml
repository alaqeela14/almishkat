backend:
  name: github
  repo: alaqeela14/mishkat-new
  branch: main
  base_url: https://sveltia-cms-auth.alaqeelafoundation.workers.dev
  auth_endpoint: auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "daily"
    label: "المحتوى اليومي"
    files:
      - name: "daily-file"
        label: "نص اليوم"
        file: "daily.json"
        fields:
          - { label: "النوع", name: "type", widget: "select", options: ["آية", "حديث", "حكمة"], default: "آية" }
          - { label: "النص", name: "text", widget: "text" }
          - { label: "المصدر", name: "source", widget: "string", required: false }

  - name: "fiqh_qa"
    label: "مسائل فقهية"
    files:
      - name: "fiqh-qa-list"
        label: "قائمة المسائل الفقهية"
        file: "fiqh-qa.json"
        fields:
          - label: "الأسئلة والأجوبة"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.question}}"
            fields:
              - { label: "السؤال", name: "question", widget: "string" }
              - { label: "الجواب", name: "answer", widget: "markdown" }
              - { label: "التصنيف", name: "category", widget: "select", required: false, options: ["حول الطهارة", "حول الصلاة", "حول الصيام", "حول الزكاة والخمس", "حول الحج", "حول الزواج", "حول النساء", "حول المعاملات", "حول العقائد", "أخرى"] }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }

  - name: "weekly"
    label: "نور الأسبوع"
    files:
      - name: "weekly-list"
        label: "قائمة الأدعية والزيارات"
        file: "weekly.json"
        fields:
          - label: "المحتوى"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} ({{fields.type}})"
            fields:
              - { label: "النوع", name: "type", widget: "select", options: ["دعاء", "زيارة", "حديث", "مناجاة"], default: "دعاء" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "النص الكامل", name: "body", widget: "markdown" }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }

  - name: "greats"
    label: "عظماؤنا"
    files:
      - name: "greats-list"
        label: "قائمة العظماء"
        file: "greats.json"
        fields:
          - label: "الشخصيات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.name}} - {{fields.title}}"
            fields:
              - { label: "الاسم", name: "name", widget: "string" }
              - { label: "اللقب / الصفة", name: "title", widget: "string", required: false }
              - { label: "الصورة الشخصية", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "نبذة مختصرة", name: "excerpt", widget: "text", required: false }
              - { label: "السيرة الكاملة", name: "body", widget: "markdown", required: false }
              - { label: "من أقواله", name: "quote", widget: "text", required: false }
              - { label: "التصنيف", name: "category", widget: "select", required: false, options: ["علماء", "فلاسفة", "شعراء", "قادة", "مصلحون", "أخرى"] }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }

  - name: "articles"
    label: "المقالات"
    files:
      - name: "articles-ahlulbayt"
        label: "أهل البيت (عليهم السلام)"
        file: "articles-ahlulbayt.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-insights"
        label: "رؤى وأفكار"
        file: "articles-insights.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-doubts"
        label: "شبهات وردود"
        file: "articles-doubts.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-dialogues"
        label: "حوارات ومقابلات"
        file: "articles-dialogues.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-family"
        label: "الأسرة والمجتمع"
        file: "articles-family.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-general"
        label: "مقالات عامة"
        file: "articles-general.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-rights"
        label: "حقوق"
        file: "articles-rights.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

  - name: "books"
    label: "الكتب"
    files:
      - name: "books-list"
        label: "قائمة الكتب"
        file: "books.json"
        fields:
          - label: "قائمة الكتب"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - { label: "تصنيف الكتاب", name: "category", widget: "select", options: ["كتب حول القرآن", "كتب عقائدية", "كتب فقهية", "كتب أخلاقية", "كتب اجتماعية", "كتب فكرية"] }
              - { label: "عنوان الكتاب", name: "title", widget: "string" }
              - { label: "المؤلف", name: "author", widget: "string", required: false }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "الوصف", name: "description", widget: "text", required: false }
              - { label: "صورة الغلاف", name: "cover", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "ملف PDF", name: "pdf_url", widget: "file", required: false, media_folder: "assets/books", public_folder: "/assets/books", accept: ".pdf" }
              - { label: "ملف Word", name: "word_url", widget: "file", required: false, media_folder: "assets/books", public_folder: "/assets/books", accept: ".doc,.docx" }

  - name: "audios"
    label: "الصوتيات"
    files:
      - name: "audios-list"
        label: "قائمة المقاطع الصوتية"
        file: "audios.json"
        fields:
          - label: "قائمة المقاطع"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} — {{fields.speaker}}"
            fields:
              - { label: "اسم الملف الصوتي (بالإنجليزي)", name: "file", widget: "string", hint: "مثال: lesson-01.mp3 — يُرفع يدويًا إلى مجلد audios" }
              - { label: "عنوان المقطع", name: "title", widget: "string" }
              - { label: "🎤 المحاضر / القارئ / المتحدث", name: "speaker", widget: "string", required: false, hint: "اسم الشخص الذي يتحدث في التسجيل" }
              - { label: "📚 السلسلة / التصنيف", name: "series", widget: "string", required: false, hint: "مثال: محاضرات حول الأخلاق" }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "الوصف", name: "description", widget: "text", required: false }

  - name: "videos"
    label: "المرئيات"
    files:
      - name: "videos-list"
        label: "قائمة المقاطع المرئية"
        file: "videos.json"
        fields:
          - label: "قائمة المقاطع"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} — {{fields.channel}}"
            fields:
              - { label: "عنوان الفيديو", name: "title", widget: "string" }
              - { label: "🎤 المحاضر / المتحدث", name: "channel", widget: "string", required: false, hint: "اسم الشخص الذي يتحدث في الفيديو" }
              - { label: "📚 السلسلة / التصنيف", name: "series", widget: "string", required: false, hint: "مثال: محاضرات حول الأخلاق، سلسلة العقائد" }
              - label: "نوع المصدر"
                name: "source_type"
                widget: "select"
                options:
                  - { label: "يوتيوب", value: "youtube" }
                  - { label: "ملف مرفوع", value: "upload" }
                  - { label: "رابط خارجي (Vimeo وغيرها)", value: "external" }
                default: "youtube"
              - { label: "رابط أو معرّف يوتيوب", name: "youtube_url", widget: "string", required: false, hint: "الصق الرابط الكامل أو المعرّف فقط. مثال: https://youtu.be/dQw4w9WgXcQ" }
              - { label: "ملف الفيديو المرفوع", name: "video_file", widget: "file", required: false, media_folder: "videos", public_folder: "/videos", accept: "video/mp4,video/webm,video/ogg", hint: "⚠️ الحد الأقصى 20MB. للمقاطع الطويلة استخدم يوتيوب" }
              - { label: "الرابط الخارجي (Embed)", name: "external_url", widget: "string", required: false, hint: "رابط Embed مباشر. مثال: https://player.vimeo.com/video/123456" }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "الوصف", name: "description", widget: "text", required: false }

  - name: "news"
    label: "الأخبار"
    files:
      - name: "news-list"
        label: "قائمة الأخبار"
        file: "news.json"
        fields:
          - label: "قائمة الأخبار"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} [{{fields.type}}]"
            fields:
              - { label: "نوع الخبر", name: "type", widget: "select", options: [{ label: "نصي", value: "text" }, { label: "فيديو", value: "video" }], default: "text" }
              - { label: "خبر عاجل؟", name: "urgent", widget: "boolean", default: false, hint: "سيظهر في تبويب الأخبار العاجلة" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "صورة الخبر", name: "image", widget: "image", required: false }
              - { label: "المقتطف", name: "excerpt", widget: "text", required: false }
              - { label: "النص الكامل", name: "body", widget: "markdown", required: false }
              - { label: "معرّف يوتيوب", name: "youtube_id", widget: "string", required: false }
              - { label: "وصف الفيديو", name: "description", widget: "text", required: false }

  - name: "useful_sites"
    label: "مواقع مفيدة"
    files:
      - name: "useful-sites-list"
        label: "قائمة المواقع"
        file: "useful-sites.json"
        fields:
          - label: "المواقع"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - { label: "الاسم", name: "name", widget: "string" }
              - { label: "الرابط", name: "url", widget: "string", hint: "https://example.com" }
              - { label: "الوصف المختصر", name: "description", widget: "text", required: false }
              - { label: "الأيقونة", name: "icon", widget: "string", required: false, default: "fa-globe", hint: "مثال: fa-book, fa-mosque, fa-graduation-cap" }
              - { label: "التصنيف", name: "category", widget: "select", required: false, options: ["مراجع دينية", "مكتبات", "مراكز بحثية", "أدوات", "أخرى"], default: "مراجع دينية" }