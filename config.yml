backend:
  name: github
  repo: alaqeela14/mishkat-new
  branch: main
  base_url: https://sveltia-cms-auth.alaqeelafoundation.workers.dev
  auth_endpoint: auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "articles"
    label: "المقالات"
    files:
      - name: "articles-list"
        label: "قائمة المقالات"
        file: "articles.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            summary: "{{fields.title_ar}} ({{fields.category}})"
            fields:
              - { label: "التصنيف", name: "category", widget: "select", options: ["حول القرآن", "أهل البيت", "رؤى وأفكار", "شبهات وردود", "قضايا معاصرة", "حوارات ومقابلات", "الأسرة والمجتمع", "مقالات عامة", "الطب"] }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان (عربي)", name: "title_ar", widget: "string" }
              - { label: "الكاتب (عربي)", name: "author_ar", widget: "string", required: false }
              - { label: "المقتطف (عربي)", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل (عربي)", name: "body_ar", widget: "markdown", required: false }
              - { label: "العنوان (إنجليزي)", name: "title_en", widget: "string", required: false }
              - { label: "الكاتب (إنجليزي)", name: "author_en", widget: "string", required: false }
              - { label: "المقتطف (إنجليزي)", name: "excerpt_en", widget: "text", required: false }
              - { label: "النص الكامل (إنجليزي)", name: "body_en", widget: "markdown", required: false }
              - { label: "العنوان (فارسي)", name: "title_fa", widget: "string", required: false }
              - { label: "الكاتب (فارسي)", name: "author_fa", widget: "string", required: false }
              - { label: "المقتطف (فارسي)", name: "excerpt_fa", widget: "text", required: false }
              - { label: "النص الكامل (فارسي)", name: "body_fa", widget: "markdown", required: false }

  - name: "books"
    label: "الكتب"
    files:
      - name: "books-list"
        label: "قائمة الكتب"
        file: "books.json"
        fields:
          - label: "قائمة الكتب"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - { label: "تصنيف الكتاب", name: "category", widget: "select", options: ["كتب حول القرآن", "كتب عقائدية", "كتب فقهية", "كتب أخلاقية", "كتب اجتماعية", "كتب فكرية"] }
              - { label: "عنوان الكتاب", name: "title", widget: "string" }
              - { label: "المؤلف", name: "author", widget: "string", required: false }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "الوصف", name: "description", widget: "text", required: false }
              - { label: "صورة الغلاف", name: "cover", widget: "image", required: false }
              - { label: "رابط PDF", name: "pdf_url", widget: "string", required: false }
              - { label: "رابط Word", name: "word_url", widget: "string", required: false }

  - name: "audios"
    label: "الصوتيات"
    files:
      - name: "audios-list"
        label: "قائمة المقاطع الصوتية"
        file: "audios.json"
        fields:
          - label: "قائمة المقاطع"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} - {{fields.speaker}}"
            fields:
              - { label: "اسم الملف (بالإنجليزي)", name: "file", widget: "string", hint: "مثال: lesson-01.mp3" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "المتحدث", name: "speaker", widget: "string", required: false }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "الوصف", name: "description", widget: "text", required: false }

  - name: "videos"
    label: "المرئيات"
    files:
      - name: "videos-list"
        label: "قائمة المقاطع المرئية"
        file: "videos.json"
        fields:
          - label: "قائمة المقاطع"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "عنوان الفيديو", name: "title", widget: "string" }
              - { label: "معرّف يوتيوب", name: "youtube_id", widget: "string", hint: "مثال: dQw4w9WgXcQ" }
              - { label: "القناة", name: "channel", widget: "string", required: false }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "الوصف", name: "description", widget: "text", required: false }

  - name: "news"
    label: "الأخبار"
    files:
      - name: "news-list"
        label: "قائمة الأخبار"
        file: "news.json"
        fields:
          - label: "قائمة الأخبار"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} [{{fields.type}}]"
            fields:
              - { label: "نوع الخبر", name: "type", widget: "select", options: [{ label: "نصي", value: "text" }, { label: "فيديو", value: "video" }], default: "text" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "صورة الخبر", name: "image", widget: "image", required: false, hint: "صورة رئيسية للخبر (اختياري - للأخبار النصية)" }
              - { label: "المقتطف (يظهر في القائمة)", name: "excerpt", widget: "text", required: false }
              - { label: "النص الكامل (للأخبار النصية)", name: "body", widget: "markdown", required: false, hint: "املأ هذا الحقل إذا كان الخبر نصيًا" }
              - { label: "معرّف يوتيوب (للأخبار المرئية)", name: "youtube_id", widget: "string", required: false, hint: "مثال: dQw4w9WgXcQ — املأ هذا الحقل إذا كان الخبر مرئيًا" }
              - { label: "وصف الفيديو (للأخبار المرئية)", name: "description", widget: "text", required: false }
