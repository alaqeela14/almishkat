backend:
  name: github
  repo: alaqeela14/mishkat-new
  branch: main
  base_url: https://sveltia-cms-auth.alaqeelafoundation.workers.dev
  auth_endpoint: auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "daily"
    label: "المحتوى اليومي"
    files:
      - name: "daily-file"
        label: "نص اليوم"
        file: "daily.json"
        fields:
          - { label: "النوع", name: "type", widget: "select", options: ["آية", "حديث", "حكمة"], default: "آية" }
          - { label: "النص", name: "text", widget: "text" }
          - { label: "المصدر", name: "source", widget: "string", required: false }

  - name: "fiqh_qa"
    label: "مسائل فقهية"
    files:
      - name: "fiqh-qa-list"
        label: "قائمة المسائل الفقهية"
        file: "fiqh-qa.json"
        fields:
          - label: "الأسئلة والأجوبة"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.question}}"
            fields:
              - { label: "السؤال", name: "question", widget: "string" }
              - { label: "الجواب", name: "answer", widget: "markdown" }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }

  - name: "weekly"
    label: "نور الأسبوع"
    files:
      - name: "weekly-list"
        label: "قائمة الأدعية والزيارات"
        file: "weekly.json"
        fields:
          - label: "المحتوى"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} ({{fields.type}})"
            fields:
              - { label: "النوع", name: "type", widget: "select", options: ["دعاء", "زيارة", "حديث", "مناجاة"], default: "دعاء" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "النص الكامل", name: "body", widget: "markdown" }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }

  - name: "articles"
    label: "المقالات"
    files:
      - name: "articles-ahlulbayt"
        label: "أهل البيت (عليهم السلام)"
        file: "articles-ahlulbayt.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-insights"
        label: "رؤى وأفكار"
        file: "articles-insights.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-doubts"
        label: "شبهات وردود"
        file: "articles-doubts.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-dialogues"
        label: "حوارات ومقابلات"
        file: "articles-dialogues.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-family"
        label: "الأسرة والمجتمع"
        file: "articles-family.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-general"
        label: "مقالات عامة"
        file: "articles-general.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

      - name: "articles-rights"
        label: "حقوق"
        file: "articles-rights.json"
        fields:
          - label: "قائمة المقالات"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title_ar}}"
            fields:
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "العنوان", name: "title_ar", widget: "string" }
              - { label: "الكاتب", name: "author_ar", widget: "string", required: false }
              - { label: "صورة المقال", name: "image", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "المقتطف", name: "excerpt_ar", widget: "text", required: false }
              - { label: "النص الكامل", name: "body_ar", widget: "markdown", required: false }

  - name: "books"
    label: "الكتب"
    files:
      - name: "books-list"
        label: "قائمة الكتب"
        file: "books.json"
        fields:
          - label: "قائمة الكتب"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - { label: "تصنيف الكتاب", name: "category", widget: "select", options: ["كتب حول القرآن", "كتب عقائدية", "كتب فقهية", "كتب أخلاقية", "كتب اجتماعية", "كتب فكرية"] }
              - { label: "عنوان الكتاب", name: "title", widget: "string" }
              - { label: "المؤلف", name: "author", widget: "string", required: false }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "الوصف", name: "description", widget: "text", required: false }
              - { label: "صورة الغلاف", name: "cover", widget: "image", required: false, media_folder: "assets/images", public_folder: "/assets/images" }
              - { label: "ملف PDF", name: "pdf_url", widget: "file", required: false, media_folder: "assets/books", public_folder: "/assets/books", accept: ".pdf" }
              - { label: "ملف Word", name: "word_url", widget: "file", required: false, media_folder: "assets/books", public_folder: "/assets/books", accept: ".doc,.docx" }

  - name: "audios"
    label: "الصوتيات"
    files:
      - name: "audios-list"
        label: "قائمة المقاطع الصوتية"
        file: "audios.json"
        fields:
          - label: "قائمة المقاطع"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} - {{fields.speaker}}"
            fields:
              - { label: "اسم الملف (بالإنجليزي)", name: "file", widget: "string", hint: "مثال: lesson-01.mp3" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "المتحدث", name: "speaker", widget: "string", required: false }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "الوصف", name: "description", widget: "text", required: false }

  - name: "videos"
    label: "المرئيات"
    files:
      - name: "videos-list"
        label: "قائمة المقاطع المرئية"
        file: "videos.json"
        fields:
          - label: "قائمة المقاطع"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { label: "عنوان الفيديو", name: "title", widget: "string" }
              - { label: "معرّف يوتيوب", name: "youtube_id", widget: "string", hint: "مثال: dQw4w9WgXcQ" }
              - { label: "القناة", name: "channel", widget: "string", required: false }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "الوصف", name: "description", widget: "text", required: false }

  - name: "news"
    label: "الأخبار"
    files:
      - name: "news-list"
        label: "قائمة الأخبار"
        file: "news.json"
        fields:
          - label: "قائمة الأخبار"
            name: "items"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} [{{fields.type}}]"
            fields:
              - { label: "نوع الخبر", name: "type", widget: "select", options: [{ label: "نصي", value: "text" }, { label: "فيديو", value: "video" }], default: "text" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "التاريخ", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "صورة الخبر", name: "image", widget: "image", required: false }
              - { label: "المقتطف", name: "excerpt", widget: "text", required: false }
              - { label: "النص الكامل", name: "body", widget: "markdown", required: false }
              - { label: "معرّف يوتيوب", name: "youtube_id", widget: "string", required: false }
              - { label: "وصف الفيديو", name: "description", widget: "text", required: false }